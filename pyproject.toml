[project]
name = "notetaker"
version = "0.1.0"
description = "Dual-channel meeting note taker: mic (left) + system audio (right), transcribed via whisper.cpp server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
